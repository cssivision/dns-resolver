name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slings
            args: ""
          - name: awak
            args: "--no-default-features --features awak-runtime"
          - name: tokio
            args: "--no-default-features --features tokio-runtime"

    steps:
    - uses: actions/checkout@v4

    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Build
      run: cargo build --verbose ${{ matrix.args }}

    - name: Test
      run: cargo test --verbose ${{ matrix.args }}

    - name: Clippy
      run: cargo clippy ${{ matrix.args }} -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: "rustfmt --check"
        run: cargo fmt --all -- --check
