[package]
name = "dns-resolver"
version = "0.3.0"
authors = ["cssivision <cssivision@gmail.com>"]
license = "MIT"
repository = "https://github.com/cssivision/dns-reolver"
description = "dns resolver based on future"
readme = "README.md"
edition = "2018"

[dependencies]
awak = "0.2.45"
domain = { version = "0.12", features = ["smallvec"] }
futures-util = { version = "0.3", default-features = false, features = ["io"] }
smallvec = "1"
lru_cache = { git = "https://github.com/cssivision/lru_cache.git" }
